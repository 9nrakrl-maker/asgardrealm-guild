<div class="modal-backdrop" (click)="close.emit()"></div>
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="history-title" (click)="$event.stopPropagation()">
  <div class="modal-header">
    <div class="title-group">
      <span class="title-icon">◷</span>
      <div><p>CHARACTER PROGRESS</p><h1 id="history-title" class="clickable-td" (click)="openProfile(name)">{{ name }}</h1></div>
    </div>
    <button class="close-button" type="button" (click)="close.emit()" aria-label="Close history">×</button>
  </div>
  <div class="modal-body">
    <div class="summary-card">
      <div class="summary-heading"><span>Current EXP</span><strong>{{ latestProgress }}%</strong></div>
      <div class="progress-track"><span [style.width.%]="progressWidth"></span></div>
      <p *ngIf="latestRecord">Lv. {{ latestRecord.level }} · Gained today {{ formatExp(latestDailyExp) }} ({{ expGainTodayPercent() }}%)</p>
    </div>

    <div class="chart-heading">
      <div><p class="chart-kicker">HISTORY RANGE</p><h2>Daily EXP earned</h2></div>
      <div class="range-picker" aria-label="History range"><button *ngFor="let r of quickRanges" type="button" [class.active]="selectedRange === r.value" (click)="onRangeChange(r.value)">{{ r.label }}</button></div>
    </div>
    <div class="chart-card"><canvas id="expChart" height="210"></canvas></div>
    <div class="level-up-section" *ngIf="levelUpList.length"><span class="level-up-label">LEVEL UPS</span><div class="level-up-list"><span *ngFor="let e of levelUpList.slice(-4)">{{ e.date }} <b>Lv. {{ e.level }}</b></span></div></div>

  </div>
</section>
